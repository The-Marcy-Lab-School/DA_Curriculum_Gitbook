<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the worst-case steps grow as the bookings grow</title>
  <desc id="d">Two bar charts side by side with the same axes. The x-axis is the number of bookings: 25,000, 50,000, 100,000 and 200,000. The y-axis is worst-case steps, from 0 to 200,000. Left, linear search, O(n): the bars rise to 25,000, 50,000, 100,000 and 200,000 steps, doubling each time the bookings double. Right, lookup by code, O(1): every bar stays at about 1 step, too small to see.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs>
  <rect width="1040" height="560" fill="#ffffff"/>
  <text x="520" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">How the worst-case steps grow as the bookings grow</text>
  <line x1="130" y1="150" x2="130" y2="430" stroke="#111827" stroke-width="2"/>
  <line x1="130" y1="430" x2="500" y2="430" stroke="#111827" stroke-width="2"/>
  <line x1="122" y1="430.0" x2="130" y2="430.0" stroke="#111827" stroke-width="2"/>
  <text x="116" y="436.0" text-anchor="end" font-size="18" fill="#111827">0</text>
  <line x1="122" y1="295.0" x2="130" y2="295.0" stroke="#111827" stroke-width="2"/>
  <text x="116" y="301.0" text-anchor="end" font-size="18" fill="#111827">100,000</text>
  <line x1="122" y1="160.0" x2="130" y2="160.0" stroke="#111827" stroke-width="2"/>
  <text x="116" y="166.0" text-anchor="end" font-size="18" fill="#111827">200,000</text>
  <rect x="152" y="396.25" width="64" height="33.75" rx="0" fill="#FDBA74" stroke="#C2410C" stroke-width="1.5"/>
  <text x="184" y="458" text-anchor="middle" font-size="17" fill="#111827">25,000</text>
  <text x="184" y="386.25" text-anchor="middle" font-size="18" font-weight="bold" fill="#C2410C">25k</text>
  <rect x="240" y="362.5" width="64" height="67.5" rx="0" fill="#FDBA74" stroke="#C2410C" stroke-width="1.5"/>
  <text x="272" y="458" text-anchor="middle" font-size="17" fill="#111827">50,000</text>
  <text x="272" y="352.5" text-anchor="middle" font-size="18" font-weight="bold" fill="#C2410C">50k</text>
  <rect x="328" y="295.0" width="64" height="135.0" rx="0" fill="#FDBA74" stroke="#C2410C" stroke-width="1.5"/>
  <text x="360" y="458" text-anchor="middle" font-size="17" fill="#111827">100,000</text>
  <text x="360" y="285.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#C2410C">100k</text>
  <rect x="416" y="160.0" width="64" height="270.0" rx="0" fill="#FDBA74" stroke="#C2410C" stroke-width="1.5"/>
  <text x="448" y="458" text-anchor="middle" font-size="17" fill="#111827">200,000</text>
  <text x="448" y="150.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#C2410C">200k</text>
  <text x="34" y="295" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827" transform="rotate(-90 34 295)">Worst-case steps</text>
  <text x="315" y="492" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Number of bookings</text>
  <text x="290" y="80" text-anchor="middle" font-size="21" font-weight="bold" fill="#C2410C">Linear search: O(n)</text>
  <text x="290" y="108" text-anchor="middle" font-size="18" fill="#111827">double the bookings, double the steps</text>
  <line x1="650" y1="150" x2="650" y2="430" stroke="#111827" stroke-width="2"/>
  <line x1="650" y1="430" x2="1020" y2="430" stroke="#111827" stroke-width="2"/>
  <line x1="642" y1="430.0" x2="650" y2="430.0" stroke="#111827" stroke-width="2"/>
  <text x="636" y="436.0" text-anchor="end" font-size="18" fill="#111827">0</text>
  <line x1="642" y1="295.0" x2="650" y2="295.0" stroke="#111827" stroke-width="2"/>
  <text x="636" y="301.0" text-anchor="end" font-size="18" fill="#111827">100,000</text>
  <line x1="642" y1="160.0" x2="650" y2="160.0" stroke="#111827" stroke-width="2"/>
  <text x="636" y="166.0" text-anchor="end" font-size="18" fill="#111827">200,000</text>
  <rect x="672" y="428" width="64" height="2" rx="0" fill="#93C5FD" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="704" y="458" text-anchor="middle" font-size="17" fill="#111827">25,000</text>
  <text x="704" y="418" text-anchor="middle" font-size="18" font-weight="bold" fill="#1D4ED8">≈1</text>
  <rect x="760" y="428" width="64" height="2" rx="0" fill="#93C5FD" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="792" y="458" text-anchor="middle" font-size="17" fill="#111827">50,000</text>
  <text x="792" y="418" text-anchor="middle" font-size="18" font-weight="bold" fill="#1D4ED8">≈1</text>
  <rect x="848" y="428" width="64" height="2" rx="0" fill="#93C5FD" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="880" y="458" text-anchor="middle" font-size="17" fill="#111827">100,000</text>
  <text x="880" y="418" text-anchor="middle" font-size="18" font-weight="bold" fill="#1D4ED8">≈1</text>
  <rect x="936" y="428" width="64" height="2" rx="0" fill="#93C5FD" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="968" y="458" text-anchor="middle" font-size="17" fill="#111827">200,000</text>
  <text x="968" y="418" text-anchor="middle" font-size="18" font-weight="bold" fill="#1D4ED8">≈1</text>
  <text x="554" y="295" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827" transform="rotate(-90 554 295)">Worst-case steps</text>
  <text x="835" y="492" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Number of bookings</text>
  <text x="810" y="80" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D4ED8">Lookup by code: O(1)</text>
  <text x="810" y="108" text-anchor="middle" font-size="18" fill="#111827">about 1 step at every size</text>
  <line x1="520" y1="70" x2="520" y2="500" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="520" y="540" text-anchor="middle" font-size="18" fill="#475569">k means thousand: 25k is 25,000 steps.</text>
</svg>
