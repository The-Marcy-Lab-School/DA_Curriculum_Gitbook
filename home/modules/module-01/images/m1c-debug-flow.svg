<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" width="1040" height="620" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Expected first, then compare</title>
  <desc id="d">A flow for finding a bug. Step 1: work out the expected behavior by hand. For sessions 50, 42, 95, 38, and 61, the expected total is 286. Step 2: run the code. Then ask: did it crash? If yes, read the traceback from the last line up. It names the line. Examples: a NameError from a scope bug, or an AttributeError from an undefined attribute. If no, compare the actual output with the expected. The code printed 236, not 286, so it is a logic error. Trace the loop to find it. Examples: an off-by-one error from range(1, len(sessions)), or a bare except that returns 0. Both paths end at step 3: fix one line, then rerun the same case and compare again.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs>
  <rect width="1040" height="620" fill="#ffffff"/>
  <text x="520" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">Expected first, then compare</text>
  <rect x="20" y="66" width="320" height="120" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="180" y="100" text-anchor="middle" font-size="19" font-weight="bold" fill="#1D4ED8">1. Work out the expected</text>
  <text x="180" y="130" text-anchor="middle" font-size="19" font-weight="bold" fill="#1D4ED8">behavior by hand</text>
  <text x="180" y="164" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">50+42+95+38+61 = 286</text>
  <line x1="342" y1="126" x2="388" y2="126" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="392" y="66" width="240" height="120" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="512" y="116" text-anchor="middle" font-size="19" font-weight="bold" fill="#1D4ED8">2. Run the code</text>
  <text x="512" y="148" text-anchor="middle" font-size="18" fill="#111827">and see what it does</text>
  <line x1="634" y1="126" x2="680" y2="126" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="684" y="86" width="336" height="80" rx="40" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="852" y="133" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Did it crash?</text>
  <line x1="760" y1="168" x2="300" y2="238" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="944" y1="168" x2="800" y2="238" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="716" y="206" text-anchor="end" font-size="18" font-weight="bold" fill="#475569">Yes</text>
  <text x="900" y="214" text-anchor="middle" font-size="18" font-weight="bold" fill="#475569">No</text>
  <rect x="20" y="242" width="480" height="200" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="260" y="276" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">Read the traceback,</text>
  <text x="260" y="304" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">last line first</text>
  <text x="260" y="336" text-anchor="middle" font-size="18" fill="#111827">It names the line that failed.</text>
  <text x="40" y="376" text-anchor="start" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111827">NameError: a scope bug</text>
  <text x="40" y="412" text-anchor="start" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111827">AttributeError: undefined attribute</text>
  <rect x="540" y="242" width="480" height="200" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
  <text x="780" y="276" text-anchor="middle" font-size="19" font-weight="bold" fill="#C2410C">Compare actual with expected</text>
  <text x="780" y="306" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Printed 236, not 286:</text>
  <text x="780" y="334" text-anchor="middle" font-size="18" fill="#111827">a logic error. Trace the loop.</text>
  <text x="560" y="376" text-anchor="start" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111827">range(1, len(sessions)): off by one</text>
  <text x="560" y="412" text-anchor="start" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111827">bare except: returns 0, hides it</text>
  <line x1="260" y1="444" x2="440" y2="500" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="780" y1="444" x2="600" y2="500" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="220" y="504" width="600" height="90" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="520" y="540" text-anchor="middle" font-size="19" font-weight="bold" fill="#1D4ED8">3. Fix one line, then rerun the same case</text>
  <text x="520" y="572" text-anchor="middle" font-size="18" fill="#111827">Prints 286 now? Then the fix worked.</text>
</svg>
