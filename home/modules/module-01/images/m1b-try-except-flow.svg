<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">What Python does with try and except</title>
  <desc id="d">A flow using read_nights.py from the reading. Python runs the line inside try: nights = int(nights_text). Then: did that line raise a ValueError? Left branch, no, for the text 3: the rest of try runs and prints Nights: 3, and except is skipped. Right branch, yes, for the text 4 nights: Python leaves try at that line and jumps to except ValueError, which prints Could not read: 4 nights. Both branches then continue to the first line after the whole try and except, which prints Done with, and the text.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs>
  <rect width="1040" height="560" fill="#ffffff"/>
  <text x="520" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">What Python does with try and except</text>
  <rect x="270" y="62" width="500" height="84" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="520" y="96" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D4ED8">1. try</text>
  <text x="520" y="128" text-anchor="middle" font-size="19" font-family="Menlo, Consolas, monospace" fill="#111827">nights = int(nights_text)</text>
  <line x1="520" y1="148" x2="520" y2="180" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="320" y="184" width="400" height="70" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="520" y="214" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">2. Did that line raise</text>
  <text x="520" y="240" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">a ValueError?</text>
  <line x1="320" y1="219" x2="250" y2="290" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="720" y1="219" x2="790" y2="290" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="262" y="242" text-anchor="end" font-size="19" font-weight="bold" fill="#475569">No: "3"</text>
  <text x="778" y="242" text-anchor="start" font-size="19" font-weight="bold" fill="#475569">Yes: "4 nights"</text>
  <rect x="20" y="294" width="460" height="110" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="250" y="328" text-anchor="middle" font-size="20" font-weight="bold" fill="#1D4ED8">The rest of try runs</text>
  <text x="250" y="358" text-anchor="middle" font-size="18" fill="#111827">Prints  Nights: 3</text>
  <text x="250" y="386" text-anchor="middle" font-size="18" fill="#111827">except is skipped</text>
  <rect x="560" y="294" width="460" height="110" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
  <text x="790" y="328" text-anchor="middle" font-size="20" font-weight="bold" fill="#C2410C">Jump to except ValueError:</text>
  <text x="790" y="358" text-anchor="middle" font-size="18" fill="#111827">The rest of try is skipped</text>
  <text x="790" y="386" text-anchor="middle" font-size="18" fill="#111827">Prints  Could not read: 4 nights</text>
  <line x1="250" y1="406" x2="400" y2="450" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="790" y1="406" x2="640" y2="450" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="240" y="454" width="560" height="84" rx="10" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="520" y="488" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">3. Continue after try/except</text>
  <text x="520" y="518" text-anchor="middle" font-size="18" fill="#111827">Prints  Done with ...  The program keeps going.</text>
</svg>
