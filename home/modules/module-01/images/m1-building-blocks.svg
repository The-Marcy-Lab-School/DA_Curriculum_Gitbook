<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The building blocks of a data program</title>
  <desc id="d">A concept map of five building blocks around a data program. Decide and repeat: if statements and loops, Quest 1.1. Organize steps: functions, Quests 1.2 and 1.7. Hold data: lists, dictionaries, and objects, Quests 1.4 and 1.8. Load, save, and protect: files, validation, and errors, Quests 1.5 and 1.6. Check your work: speed and debugging, Quests 1.3, 1.9, and 1.10.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs>
  <rect width="1040" height="520" fill="#ffffff"/>
  <text x="520" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">The building blocks of a data program</text>
  <rect x="380" y="215" width="280" height="90" rx="45" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="520" y="255" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">A data program</text>
  <text x="520" y="282" text-anchor="middle" font-size="18" fill="#111827">written in Python</text>
  <rect x="30" y="64" width="300" height="108" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="180" y="98" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D4ED8">Decide and repeat</text>
  <text x="180" y="128" text-anchor="middle" font-size="18" fill="#111827">if statements and loops</text>
  <text x="180" y="156" text-anchor="middle" font-size="17" fill="#475569">Quest 1.1</text>
  <rect x="710" y="64" width="300" height="108" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="860" y="98" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D4ED8">Organize steps</text>
  <text x="860" y="128" text-anchor="middle" font-size="18" fill="#111827">functions</text>
  <text x="860" y="156" text-anchor="middle" font-size="17" fill="#475569">Quests 1.2, 1.7</text>
  <rect x="30" y="344" width="300" height="108" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="180" y="378" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D4ED8">Hold data</text>
  <text x="180" y="408" text-anchor="middle" font-size="18" fill="#111827">lists, dictionaries, objects</text>
  <text x="180" y="436" text-anchor="middle" font-size="17" fill="#475569">Quests 1.4, 1.8</text>
  <rect x="710" y="344" width="300" height="108" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="860" y="378" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D4ED8">Load, save, and protect</text>
  <text x="860" y="408" text-anchor="middle" font-size="18" fill="#111827">files, validation, errors</text>
  <text x="860" y="436" text-anchor="middle" font-size="17" fill="#475569">Quests 1.5, 1.6</text>
  <rect x="370" y="400" width="300" height="108" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="520" y="434" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D4ED8">Check your work</text>
  <text x="520" y="464" text-anchor="middle" font-size="18" fill="#111827">speed and debugging</text>
  <text x="520" y="492" text-anchor="middle" font-size="17" fill="#475569">Quests 1.3, 1.9, 1.10</text>
  <line x1="330" y1="118" x2="400" y2="215" stroke="#94A3B8" stroke-width="2.5"/>
  <line x1="710" y1="118" x2="640" y2="215" stroke="#94A3B8" stroke-width="2.5"/>
  <line x1="330" y1="398" x2="400" y2="305" stroke="#94A3B8" stroke-width="2.5"/>
  <line x1="710" y1="398" x2="640" y2="305" stroke="#94A3B8" stroke-width="2.5"/>
  <line x1="520" y1="307" x2="520" y2="398" stroke="#94A3B8" stroke-width="2.5"/>
</svg>
