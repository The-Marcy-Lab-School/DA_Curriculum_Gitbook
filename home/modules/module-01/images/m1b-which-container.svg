<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Which container fits the job?</title>
  <desc id="d">A decision tree with three questions, using the food delivery app from the reading. First: do you find each value by a label? If yes, use a dictionary, like drivers with the key D-5521 and the value Sam. If no: does each value only need to be there once? If yes, use a set, like the customers who used a coupon. If no: must the data never change? If yes, use a tuple, like a finished order, D-5520 at 7:42 PM. If no, use a list, like a driver's stops, which can be added to and changed.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs>
  <rect width="1040" height="600" fill="#ffffff"/>
  <text x="520" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">Which container fits the job?</text>
  <rect x="40" y="70" width="400" height="96" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="240" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Do you find each value</text>
  <text x="240" y="138" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">by a label (a key)?</text>
  <line x1="442" y1="118" x2="556" y2="118" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="499" y="108" text-anchor="middle" font-size="18" font-weight="bold" fill="#475569">Yes</text>
  <rect x="560" y="70" width="440" height="96" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="580" y="102" text-anchor="start" font-size="21" font-weight="bold" fill="#1D4ED8">Dictionary</text>
  <text x="724" y="102" text-anchor="start" font-size="18" fill="#111827">Order code → driver</text>
  <text x="580" y="142" text-anchor="start" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">drivers["D-5521"]  # Sam</text>
  <line x1="240" y1="168" x2="240" y2="196" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="252" y="188" text-anchor="start" font-size="18" font-weight="bold" fill="#475569">No</text>
  <rect x="40" y="200" width="400" height="96" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="240" y="240" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Does each value only</text>
  <text x="240" y="268" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">need to be there once?</text>
  <line x1="442" y1="248" x2="556" y2="248" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="499" y="238" text-anchor="middle" font-size="18" font-weight="bold" fill="#475569">Yes</text>
  <rect x="560" y="200" width="440" height="96" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="580" y="232" text-anchor="start" font-size="21" font-weight="bold" fill="#1D4ED8">Set</text>
  <text x="633" y="232" text-anchor="start" font-size="18" fill="#111827">Customers who used a coupon</text>
  <text x="580" y="272" text-anchor="start" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">used.add("Noor")</text>
  <line x1="240" y1="298" x2="240" y2="326" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="252" y="318" text-anchor="start" font-size="18" font-weight="bold" fill="#475569">No</text>
  <rect x="40" y="330" width="400" height="96" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="240" y="370" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Must the data</text>
  <text x="240" y="398" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">never change?</text>
  <line x1="442" y1="378" x2="556" y2="378" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="499" y="368" text-anchor="middle" font-size="18" font-weight="bold" fill="#475569">Yes</text>
  <rect x="560" y="330" width="440" height="96" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="580" y="362" text-anchor="start" font-size="21" font-weight="bold" fill="#1D4ED8">Tuple</text>
  <text x="659" y="362" text-anchor="start" font-size="18" fill="#111827">A finished order</text>
  <text x="580" y="402" text-anchor="start" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">("D-5520", "7:42 PM")</text>
  <line x1="240" y1="428" x2="240" y2="456" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="252" y="448" text-anchor="start" font-size="18" font-weight="bold" fill="#475569">No</text>
  <rect x="40" y="460" width="400" height="96" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="60" y="492" text-anchor="start" font-size="21" font-weight="bold" fill="#1D4ED8">List</text>
  <text x="126" y="492" text-anchor="start" font-size="18" fill="#111827">A driver's stops</text>
  <text x="60" y="532" text-anchor="start" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">stops.append("Oak Rd")</text>
  <text x="720" y="502" text-anchor="middle" font-size="18" fill="#475569">A list is the default: it keeps order,</text>
  <text x="720" y="528" text-anchor="middle" font-size="18" fill="#475569">allows repeats, and can change.</text>
</svg>
