<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Which method does Python use?</title>
  <desc id="d">A decision tree. Start with the question: what is asking Python to describe the object? Left branch: print(obj), str(obj), or an f-string asks for the friendly view. If the class has __str__, Python uses it and shows Biscuit the dog. If the class has no __str__, Python falls back to __repr__ and shows Pet('Biscuit', 'dog'). Right branch: repr(obj), or the object sitting inside a list, always uses __repr__, so a list of two pets prints [Pet('Biscuit', 'dog'), Pet('Mochi', 'cat')]. At the bottom: with neither method, Python shows the default, the class name plus a memory address.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs>
  <rect width="1040" height="560" fill="#ffffff"/>
  <text x="520" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">Which method does Python use?</text>
  <rect x="250" y="58" width="540" height="56" rx="28" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="520" y="93" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">What is asking Python to describe the object?</text>
  <line x1="380" y1="116" x2="260" y2="160" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="660" y1="116" x2="780" y2="160" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="20" y="164" width="480" height="84" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="260" y="196" text-anchor="middle" font-size="19" font-weight="bold" fill="#1D4ED8">For people: the friendly view</text>
  <text x="260" y="228" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">print(obj) · str(obj) · f"{obj}"</text>
  <line x1="260" y1="250" x2="260" y2="282" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="80" y="286" width="360" height="50" rx="25" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="260" y="318" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Does the class have __str__?</text>
  <line x1="190" y1="338" x2="135" y2="380" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="330" y1="338" x2="385" y2="380" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="150" y="358" text-anchor="end" font-size="18" font-weight="bold" fill="#1D4ED8">Yes</text>
  <text x="372" y="358" text-anchor="start" font-size="18" font-weight="bold" fill="#C2410C">No</text>
  <rect x="20" y="384" width="230" height="104" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="135" y="416" text-anchor="middle" font-size="18" font-weight="bold" fill="#1D4ED8">Uses __str__</text>
  <text x="135" y="452" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">Biscuit the dog</text>
  <rect x="270" y="384" width="230" height="104" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
  <text x="385" y="416" text-anchor="middle" font-size="18" font-weight="bold" fill="#C2410C">Falls back to __repr__</text>
  <text x="385" y="452" text-anchor="middle" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111827">Pet('Biscuit',</text>
  <text x="385" y="476" text-anchor="middle" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111827">'dog')</text>
  <rect x="540" y="164" width="480" height="84" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
  <text x="780" y="196" text-anchor="middle" font-size="19" font-weight="bold" fill="#C2410C">For programmers: the exact view</text>
  <text x="780" y="228" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">repr(obj) · inside a list</text>
  <line x1="780" y1="250" x2="780" y2="380" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="540" y="384" width="480" height="104" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
  <text x="780" y="416" text-anchor="middle" font-size="18" font-weight="bold" fill="#C2410C">Always uses __repr__</text>
  <text x="780" y="452" text-anchor="middle" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111827">[Pet('Biscuit', 'dog'),</text>
  <text x="780" y="476" text-anchor="middle" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111827"> Pet('Mochi', 'cat')]</text>
  <text x="520" y="532" text-anchor="middle" font-size="18" fill="#475569">Neither method?  Python shows  &lt;__main__.Pet object at 0x7f...&gt;</text>
</svg>
