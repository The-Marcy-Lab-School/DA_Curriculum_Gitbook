<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="1040" height="440" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Two ways to find QX7RT2</title>
  <desc id="d">Two panels side by side, each with the same 4 bookings in positions 0 to 3: LM2B8K, RT9PW4, BB4HN1 and QX7RT2. Left, linear search: it checks position 0, then 1, then 2, then 3, so finding QX7RT2 at the end takes 4 checks. Double the list to 8 bookings and the worst case is 8 checks. This is O(n). Right, lookup: bookings[3] jumps straight to position 3 in 1 step, the same with 4 bookings or 200,000. This is O(1).</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs>
  <rect width="1040" height="440" fill="#ffffff"/>
  <text x="520" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">Two ways to find QX7RT2</text>
  <text x="255" y="84" text-anchor="middle" font-size="21" font-weight="bold" fill="#C2410C">Linear search</text>
  <text x="255" y="112" text-anchor="middle" font-size="18" fill="#111827">check one at a time, in order</text>
  <rect x="20" y="200" width="100" height="60" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
  <text x="70" y="237" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">LM2B8K</text>
  <text x="70" y="288" text-anchor="middle" font-size="17" fill="#475569">position 0</text>
  <rect x="140" y="200" width="100" height="60" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
  <text x="190" y="237" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">RT9PW4</text>
  <text x="190" y="288" text-anchor="middle" font-size="17" fill="#475569">position 1</text>
  <rect x="260" y="200" width="100" height="60" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
  <text x="310" y="237" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">BB4HN1</text>
  <text x="310" y="288" text-anchor="middle" font-size="17" fill="#475569">position 2</text>
  <rect x="380" y="200" width="100" height="60" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
  <text x="430" y="237" text-anchor="middle" font-size="18" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#111827">QX7RT2</text>
  <text x="430" y="288" text-anchor="middle" font-size="17" fill="#475569">position 3</text>
  <circle cx="70" cy="166" r="17" fill="#ffffff" stroke="#C2410C" stroke-width="2"/>
  <text x="70" y="172" text-anchor="middle" font-size="18" font-weight="bold" fill="#C2410C">1</text>
  <line x1="89" y1="166" x2="169" y2="166" stroke="#C2410C" stroke-width="2.5" marker-end="url(#a)"/>
  <circle cx="190" cy="166" r="17" fill="#ffffff" stroke="#C2410C" stroke-width="2"/>
  <text x="190" y="172" text-anchor="middle" font-size="18" font-weight="bold" fill="#C2410C">2</text>
  <line x1="209" y1="166" x2="289" y2="166" stroke="#C2410C" stroke-width="2.5" marker-end="url(#a)"/>
  <circle cx="310" cy="166" r="17" fill="#ffffff" stroke="#C2410C" stroke-width="2"/>
  <text x="310" y="172" text-anchor="middle" font-size="18" font-weight="bold" fill="#C2410C">3</text>
  <line x1="329" y1="166" x2="409" y2="166" stroke="#C2410C" stroke-width="2.5" marker-end="url(#a)"/>
  <circle cx="430" cy="166" r="17" fill="#ffffff" stroke="#C2410C" stroke-width="2"/>
  <text x="430" y="172" text-anchor="middle" font-size="18" font-weight="bold" fill="#C2410C">4</text>
  <text x="255" y="334" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">4 checks for 4 bookings.</text>
  <text x="255" y="362" text-anchor="middle" font-size="19" fill="#111827">8 bookings: 8 checks.</text>
  <text x="255" y="410" text-anchor="middle" font-size="20" font-weight="bold" fill="#C2410C">O(n): the work grows with n</text>
  <line x1="520" y1="70" x2="520" y2="420" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="785" y="84" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D4ED8">Lookup</text>
  <text x="785" y="112" text-anchor="middle" font-size="18" fill="#111827">jump straight to the position</text>
  <rect x="550" y="200" width="100" height="60" rx="8" fill="#ffffff" stroke="#94A3B8" stroke-width="2"/>
  <text x="600" y="237" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">LM2B8K</text>
  <text x="600" y="288" text-anchor="middle" font-size="17" fill="#475569">position 0</text>
  <rect x="670" y="200" width="100" height="60" rx="8" fill="#ffffff" stroke="#94A3B8" stroke-width="2"/>
  <text x="720" y="237" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">RT9PW4</text>
  <text x="720" y="288" text-anchor="middle" font-size="17" fill="#475569">position 1</text>
  <rect x="790" y="200" width="100" height="60" rx="8" fill="#ffffff" stroke="#94A3B8" stroke-width="2"/>
  <text x="840" y="237" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">BB4HN1</text>
  <text x="840" y="288" text-anchor="middle" font-size="17" fill="#475569">position 2</text>
  <rect x="910" y="200" width="100" height="60" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="960" y="237" text-anchor="middle" font-size="18" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#111827">QX7RT2</text>
  <text x="960" y="288" text-anchor="middle" font-size="17" fill="#475569">position 3</text>
  <rect x="840" y="140" width="140" height="40" rx="8" fill="#ffffff" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="910" y="167" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">bookings[3]</text>
  <line x1="910" y1="182" x2="910" y2="196" stroke="#1D4ED8" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="785" y="334" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">1 step for 4 bookings.</text>
  <text x="785" y="362" text-anchor="middle" font-size="19" fill="#111827">200,000 bookings: still about 1.</text>
  <text x="785" y="410" text-anchor="middle" font-size="20" font-weight="bold" fill="#1D4ED8">O(1): the work stays about the same</text>
</svg>
