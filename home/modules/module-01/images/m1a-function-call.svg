<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">What happens when you call a function</title>
  <desc id="d">On the left, the call: saved = wash_cost(2, 3.5). The two arguments, 2 and 3.5, go into the function. Inside the function box, labeled def wash_cost(loads, price_per_load): step 1, each parameter gets its argument, so loads is 2 and price_per_load is 3.5. Step 2, the body runs: loads times price_per_load is 2 times 3.5, which is 7.0. Step 3, return hands 7.0 back to the line that called the function. At the bottom left, saved now holds 7.0, the return value.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs>
  <rect width="1040" height="470" fill="#ffffff"/>
  <text x="520" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">What happens when you call a function</text>
  <rect x="20" y="90" width="360" height="110" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="200" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">The call</text>
  <text x="200" y="168" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">saved = wash_cost(2, 3.5)</text>
  <line x1="382" y1="145" x2="436" y2="145" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="440" y="70" width="580" height="320" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="730" y="106" text-anchor="middle" font-size="18" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1D4ED8">def wash_cost(loads, price_per_load):</text>
  <text x="470" y="150" text-anchor="start" font-size="19" font-weight="bold" fill="#111827">1. Each parameter gets its argument</text>
  <rect x="470" y="166" width="200" height="50" rx="8" fill="#ffffff" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="570" y="198" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">loads = 2</text>
  <rect x="690" y="166" width="300" height="50" rx="8" fill="#ffffff" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="840" y="198" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">price_per_load = 3.5</text>
  <text x="470" y="254" text-anchor="start" font-size="19" font-weight="bold" fill="#111827">2. The body runs</text>
  <text x="490" y="288" text-anchor="start" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">loads * price_per_load  →  2 * 3.5  =  7.0</text>
  <text x="470" y="336" text-anchor="start" font-size="19" font-weight="bold" fill="#111827">3. return hands back 7.0</text>
  <line x1="436" y1="330" x2="382" y2="330" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="20" y="285" width="360" height="90" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
  <text x="200" y="322" text-anchor="middle" font-size="20" font-weight="bold" fill="#C2410C">saved now holds 7.0</text>
  <text x="200" y="352" text-anchor="middle" font-size="18" fill="#111827">This is the return value.</text>
  <text x="520" y="436" text-anchor="middle" font-size="19" fill="#475569">Parameters are names in the def line. Arguments are the values in the call.</text>
</svg>
