<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 570" width="1040" height="570" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Finding your way around the garden folder</title>
  <desc id="d">Left: the garden folder as a tree. The home folder sam holds garden. garden is the working directory, marked You are here. garden holds README.md, notes, and plants. plants holds peppers.txt and tomatoes.txt. An arrow labeled cd plants goes down into plants, and an arrow labeled cd .. goes back up. Right: five commands. pwd answers Where am I? and prints /Users/sam/garden. ls answers What is here? and prints README.md notes plants. cd plants moves into plants and prints nothing. cd .. moves up one level. cat tomatoes.txt prints the file. Bottom: the absolute path to plants is /Users/sam/garden/plants, and the relative path from garden is plants.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs>
  <rect width="1040" height="570" fill="#ffffff"/>
  <text x="520" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">Finding your way around the garden folder</text>
  <rect x="165" y="66" width="210" height="46" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="270" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">sam (home folder)</text>
  <line x1="270" y1="112" x2="270" y2="150" stroke="#475569" stroke-width="2"/>
  <rect x="185" y="150" width="170" height="46" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="2.5"/>
  <text x="270" y="180" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">garden</text>
  <text x="176" y="180" text-anchor="end" font-size="18" font-weight="bold" fill="#C2410C">You are here</text>
  <line x1="270" y1="196" x2="270" y2="250" stroke="#475569" stroke-width="2"/>
  <line x1="90" y1="250" x2="450" y2="250" stroke="#475569" stroke-width="2"/>
  <line x1="90" y1="250" x2="90" y2="280" stroke="#475569" stroke-width="2"/>
  <rect x="15" y="280" width="150" height="46" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="90" y="310" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">README.md</text>
  <line x1="270" y1="250" x2="270" y2="280" stroke="#475569" stroke-width="2"/>
  <rect x="195" y="280" width="150" height="46" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="270" y="310" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">notes</text>
  <line x1="450" y1="250" x2="450" y2="280" stroke="#475569" stroke-width="2"/>
  <rect x="375" y="280" width="150" height="46" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="450" y="310" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">plants</text>
  <line x1="364" y1="180" x2="496" y2="278" stroke="#1D4ED8" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="400" y="232" text-anchor="end" font-size="17" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1D4ED8">cd plants</text>
  <line x1="516" y1="278" x2="388" y2="182" stroke="#1D4ED8" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="474" y="214" text-anchor="start" font-size="17" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1D4ED8">cd ..</text>
  <line x1="450" y1="326" x2="450" y2="352" stroke="#475569" stroke-width="2"/>
  <line x1="345" y1="352" x2="555" y2="352" stroke="#475569" stroke-width="2"/>
  <line x1="345" y1="352" x2="345" y2="372" stroke="#475569" stroke-width="2"/>
  <rect x="250" y="372" width="190" height="46" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="345" y="402" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">peppers.txt</text>
  <line x1="555" y1="352" x2="555" y2="372" stroke="#475569" stroke-width="2"/>
  <rect x="460" y="372" width="190" height="46" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="555" y="402" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" fill="#111827">tomatoes.txt</text>
  <text x="450" y="452" text-anchor="middle" font-size="17" fill="#475569">Absolute path to plants:</text>
  <text x="450" y="478" text-anchor="middle" font-size="18" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#111827">/Users/sam/garden/plants</text>
  <text x="450" y="512" text-anchor="middle" font-size="17" fill="#475569">Relative path from garden:</text>
  <text x="450" y="538" text-anchor="middle" font-size="18" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#111827">plants</text>
  <rect x="690" y="66" width="335" height="82" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="706" y="96" text-anchor="start" font-size="18" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1D4ED8">$ pwd</text>
  <text x="1010" y="96" text-anchor="end" font-size="17" font-weight="bold" fill="#111827">Where am I?</text>
  <text x="706" y="128" text-anchor="start" font-size="17" font-family="Menlo, Consolas, monospace" fill="#475569">/Users/sam/garden</text>
  <rect x="690" y="164" width="335" height="82" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="706" y="194" text-anchor="start" font-size="18" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1D4ED8">$ ls</text>
  <text x="1010" y="194" text-anchor="end" font-size="17" font-weight="bold" fill="#111827">What is here?</text>
  <text x="706" y="226" text-anchor="start" font-size="17" font-family="Menlo, Consolas, monospace" fill="#475569">README.md notes plants</text>
  <rect x="690" y="262" width="335" height="82" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="706" y="292" text-anchor="start" font-size="18" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1D4ED8">$ cd plants</text>
  <text x="1010" y="292" text-anchor="end" font-size="17" font-weight="bold" fill="#111827">Move into plants</text>
  <text x="706" y="324" text-anchor="start" font-size="17" fill="#475569">(prints nothing)</text>
  <rect x="690" y="360" width="335" height="82" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="706" y="390" text-anchor="start" font-size="18" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1D4ED8">$ cd ..</text>
  <text x="1010" y="390" text-anchor="end" font-size="17" font-weight="bold" fill="#111827">Move up one level</text>
  <text x="706" y="422" text-anchor="start" font-size="17" fill="#475569">(prints nothing)</text>
  <rect x="690" y="458" width="335" height="82" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="706" y="488" text-anchor="start" font-size="18" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1D4ED8">$ cat tomatoes.txt</text>
  <text x="1010" y="488" text-anchor="end" font-size="17" font-weight="bold" fill="#111827">Print a file</text>
  <text x="706" y="520" text-anchor="start" font-size="17" fill="#475569">the tomato notes</text>
</svg>
