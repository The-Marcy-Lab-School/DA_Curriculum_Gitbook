<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" width="1040" height="480" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Averaging ZIP codes gives a number that means nothing</title>
<desc id="d">The same two customers, two columns. Left, ZIP codes: Customer A lives in 10027 and Customer B lives in 10001. Average = (10027 + 10001) ÷ 2 = 20028 ÷ 2 = 10014, shown in red. The math is right, but neither customer lives in 10014. Right, dollars spent: Customer A spent $20 and Customer B spent $40. Average = ($20 + $40) ÷ 2 = $60 ÷ 2 = $30, which is how much a customer usually spends.</desc>
<rect width="1040" height="480" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
</marker>
</defs>

<!-- Left panel: ZIP codes -->
<text x="265" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">ZIP codes: labels, not amounts</text>
<rect x="60" y="62" width="180" height="88" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="150" y="92" text-anchor="middle" font-size="18" fill="#111827">Customer A</text>
<text x="150" y="132" text-anchor="middle" font-size="28" font-weight="bold" fill="#111827">10027</text>
<rect x="290" y="62" width="180" height="88" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="380" y="92" text-anchor="middle" font-size="18" fill="#111827">Customer B</text>
<text x="380" y="132" text-anchor="middle" font-size="28" font-weight="bold" fill="#111827">10001</text>
<line x1="265" y1="156" x2="265" y2="194" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="165" y="200" width="200" height="88" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2.5"/>
<text x="265" y="230" text-anchor="middle" font-size="18" fill="#B91C1C">Average ZIP code</text>
<text x="265" y="270" text-anchor="middle" font-size="28" font-weight="bold" fill="#B91C1C">10014</text>
<rect x="20" y="310" width="490" height="155" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="40" y="344" font-size="19" font-weight="bold" fill="#111827">Average = sum ÷ number of values</text>
<text x="40" y="380" font-size="19" fill="#111827">= (10027 + 10001) ÷ 2</text>
<text x="40" y="412" font-size="19" fill="#111827">= 20028 ÷ 2 = 10014</text>
<text x="40" y="448" font-size="19" font-weight="bold" fill="#B91C1C">Neither customer lives in 10014.</text>

<!-- Right panel: dollars spent -->
<text x="775" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Dollars spent: real amounts</text>
<rect x="570" y="62" width="180" height="88" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="660" y="92" text-anchor="middle" font-size="18" fill="#111827">Customer A</text>
<text x="660" y="132" text-anchor="middle" font-size="28" font-weight="bold" fill="#111827">$20</text>
<rect x="800" y="62" width="180" height="88" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="890" y="92" text-anchor="middle" font-size="18" fill="#111827">Customer B</text>
<text x="890" y="132" text-anchor="middle" font-size="28" font-weight="bold" fill="#111827">$40</text>
<line x1="775" y1="156" x2="775" y2="194" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="675" y="200" width="200" height="88" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="775" y="230" text-anchor="middle" font-size="18" fill="#111827">Average spent</text>
<text x="775" y="270" text-anchor="middle" font-size="28" font-weight="bold" fill="#1D4ED8">$30</text>
<rect x="530" y="310" width="490" height="155" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="550" y="344" font-size="19" font-weight="bold" fill="#111827">Average = sum ÷ number of values</text>
<text x="550" y="380" font-size="19" fill="#111827">= ($20 + $40) ÷ 2</text>
<text x="550" y="412" font-size="19" fill="#111827">= $60 ÷ 2 = $30</text>
<text x="550" y="448" font-size="19" font-weight="bold" fill="#1D4ED8">A customer usually spends about $30.</text>
</svg>
