<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 430" width="1060" height="430" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How a change gets from your laptop to GitHub</title>
  <desc id="d">A flow from left to right. 1, Your folder: you edit notes.md. git add moves the change to 2, the staging area, which holds the changes picked for the next commit. git commit saves them as 3, a commit: a snapshot saved on your laptop. git push sends commits to 4, GitHub, a copy online that other people can see. Steps 1 to 3 happen in Git, software on your laptop that needs no internet. Step 4 is GitHub, a website. A commit is not on GitHub until you push it.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs>
  <rect width="1060" height="430" fill="#ffffff"/>
  <text x="530" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">How a change gets from your laptop to GitHub</text>
  <rect x="12" y="150" width="164" height="170" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="94" y="186" text-anchor="middle" font-size="19" font-weight="bold" fill="#475569">1. Your folder</text>
  <text x="94" y="222" text-anchor="middle" font-size="18" fill="#111827">You edit</text>
  <text x="94" y="248" text-anchor="middle" font-size="18" fill="#111827">notes.md</text>
  <rect x="302" y="150" width="164" height="170" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="384" y="186" text-anchor="middle" font-size="19" font-weight="bold" fill="#1D4ED8">2. Staging area</text>
  <text x="384" y="222" text-anchor="middle" font-size="18" fill="#111827">Changes picked</text>
  <text x="384" y="248" text-anchor="middle" font-size="18" fill="#111827">for the next</text>
  <text x="384" y="274" text-anchor="middle" font-size="18" fill="#111827">commit</text>
  <rect x="592" y="150" width="164" height="170" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="674" y="186" text-anchor="middle" font-size="19" font-weight="bold" fill="#1D4ED8">3. Commits</text>
  <text x="674" y="222" text-anchor="middle" font-size="18" fill="#111827">Snapshots</text>
  <text x="674" y="248" text-anchor="middle" font-size="18" fill="#111827">saved on</text>
  <text x="674" y="274" text-anchor="middle" font-size="18" fill="#111827">your laptop</text>
  <rect x="882" y="150" width="164" height="170" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
  <text x="964" y="186" text-anchor="middle" font-size="19" font-weight="bold" fill="#C2410C">4. GitHub</text>
  <text x="964" y="222" text-anchor="middle" font-size="18" fill="#111827">A copy online</text>
  <text x="964" y="248" text-anchor="middle" font-size="18" fill="#111827">that other</text>
  <text x="964" y="274" text-anchor="middle" font-size="18" fill="#111827">people can see</text>
  <line x1="180" y1="235" x2="298" y2="235" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="239" y="222" text-anchor="middle" font-size="17" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#111827">git add</text>
  <line x1="470" y1="235" x2="588" y2="235" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="529" y="222" text-anchor="middle" font-size="17" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#111827">git commit</text>
  <line x1="760" y1="235" x2="878" y2="235" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="819" y="222" text-anchor="middle" font-size="17" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#111827">git push</text>
  <line x1="12" y1="120" x2="756" y2="120" stroke="#1D4ED8" stroke-width="2.5"/>
  <line x1="12" y1="120" x2="12" y2="136" stroke="#1D4ED8" stroke-width="2.5"/>
  <line x1="756" y1="120" x2="756" y2="136" stroke="#1D4ED8" stroke-width="2.5"/>
  <text x="384" y="106" text-anchor="middle" font-size="19" font-weight="bold" fill="#1D4ED8">Git: software on your laptop (no internet needed)</text>
  <line x1="882" y1="120" x2="1046" y2="120" stroke="#C2410C" stroke-width="2.5"/>
  <line x1="882" y1="120" x2="882" y2="136" stroke="#C2410C" stroke-width="2.5"/>
  <line x1="1046" y1="120" x2="1046" y2="136" stroke="#C2410C" stroke-width="2.5"/>
  <text x="964" y="106" text-anchor="middle" font-size="19" font-weight="bold" fill="#C2410C">GitHub: a website</text>
  <rect x="230" y="352" width="600" height="50" rx="25" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="530" y="384" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">A commit is not on GitHub until you push it.</text>
</svg>
