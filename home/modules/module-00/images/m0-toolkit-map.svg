<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Your analyst toolkit</title>
  <desc id="d">A concept map. In the middle is you, the analyst. Around you are four parts of your toolkit. Use the terminal: how do I move around my computer and run tools? Understand data: what kind of data is this? Save with Git: how do I keep every step of my work? Verify claims: should I trust what an AI told me?</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs>
  <rect width="1040" height="470" fill="#ffffff"/>
  <text x="520" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">Your analyst toolkit</text>
  <rect x="395" y="205" width="250" height="80" rx="40" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="520" y="252" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">You, the analyst</text>
  <rect x="40" y="70" width="320" height="124" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="200" y="104" text-anchor="middle" font-size="22" font-weight="bold" fill="#1D4ED8">Use the terminal</text>
  <text x="200" y="134" text-anchor="middle" font-size="18" fill="#111827">How do I move around</text>
  <text x="200" y="158" text-anchor="middle" font-size="18" fill="#111827">and run tools?</text>
  <text x="200" y="184" text-anchor="middle" font-size="17" fill="#475569">Quest 0.1</text>
  <rect x="680" y="70" width="320" height="124" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="840" y="104" text-anchor="middle" font-size="22" font-weight="bold" fill="#1D4ED8">Understand data</text>
  <text x="840" y="134" text-anchor="middle" font-size="18" fill="#111827">What kind of data</text>
  <text x="840" y="158" text-anchor="middle" font-size="18" fill="#111827">is this?</text>
  <text x="840" y="184" text-anchor="middle" font-size="17" fill="#475569">Quest 0.2</text>
  <rect x="40" y="320" width="320" height="124" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="200" y="354" text-anchor="middle" font-size="22" font-weight="bold" fill="#1D4ED8">Save with Git</text>
  <text x="200" y="384" text-anchor="middle" font-size="18" fill="#111827">How do I keep every</text>
  <text x="200" y="408" text-anchor="middle" font-size="18" fill="#111827">step of my work?</text>
  <text x="200" y="434" text-anchor="middle" font-size="17" fill="#475569">Quest 0.3</text>
  <rect x="680" y="320" width="320" height="124" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="840" y="354" text-anchor="middle" font-size="22" font-weight="bold" fill="#1D4ED8">Verify claims</text>
  <text x="840" y="384" text-anchor="middle" font-size="18" fill="#111827">Should I trust what</text>
  <text x="840" y="408" text-anchor="middle" font-size="18" fill="#111827">an AI told me?</text>
  <text x="840" y="434" text-anchor="middle" font-size="17" fill="#475569">Quest 0.4</text>
  <line x1="360" y1="132" x2="440" y2="205" stroke="#94A3B8" stroke-width="2.5"/>
  <line x1="680" y1="132" x2="600" y2="205" stroke="#94A3B8" stroke-width="2.5"/>
  <line x1="360" y1="382" x2="440" y2="285" stroke="#94A3B8" stroke-width="2.5"/>
  <line x1="680" y1="382" x2="600" y2="285" stroke="#94A3B8" stroke-width="2.5"/>
</svg>
