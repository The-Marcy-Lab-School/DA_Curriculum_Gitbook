<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" width="1040" height="430" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Blanks counted as 0 pull the average down</title>
<desc id="d">Ten customers were asked to rate a store visit from 1 to 5. Seven answered 5, 4, 4, 5, 3, 4, and 3, and three skipped the question. Left: the three blanks are counted as 0 and shown in red. Average = (5 + 4 + 4 + 5 + 3 + 4 + 3 + 0 + 0 + 0) ÷ 10 = 28 ÷ 10 = 2.8, but no customer gave a 0. Right: the three blanks are skipped. Average = (5 + 4 + 4 + 5 + 3 + 4 + 3) ÷ 7 = 28 ÷ 7 = 4.0, which matches what customers said.</desc>
<rect width="1040" height="430" fill="#ffffff"/>
<text x="265" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Blanks counted as 0</text>
<rect x="41" y="62" width="80" height="64" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="81" y="104" text-anchor="middle" font-size="28" fill="#111827">5</text>
<rect x="133" y="62" width="80" height="64" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="173" y="104" text-anchor="middle" font-size="28" fill="#111827">4</text>
<rect x="225" y="62" width="80" height="64" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="265" y="104" text-anchor="middle" font-size="28" fill="#111827">4</text>
<rect x="317" y="62" width="80" height="64" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="357" y="104" text-anchor="middle" font-size="28" fill="#111827">5</text>
<rect x="409" y="62" width="80" height="64" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="449" y="104" text-anchor="middle" font-size="28" fill="#111827">3</text>
<rect x="41" y="142" width="80" height="64" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="81" y="184" text-anchor="middle" font-size="28" fill="#111827">4</text>
<rect x="133" y="142" width="80" height="64" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="173" y="184" text-anchor="middle" font-size="28" fill="#111827">3</text>
<rect x="225" y="142" width="80" height="64" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2.5"/>
<text x="265" y="184" text-anchor="middle" font-size="28" font-weight="bold" fill="#B91C1C">0</text>
<rect x="317" y="142" width="80" height="64" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2.5"/>
<text x="357" y="184" text-anchor="middle" font-size="28" font-weight="bold" fill="#B91C1C">0</text>
<rect x="409" y="142" width="80" height="64" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2.5"/>
<text x="449" y="184" text-anchor="middle" font-size="28" font-weight="bold" fill="#B91C1C">0</text>
<rect x="20" y="230" width="490" height="185" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="40" y="266" font-size="19" font-weight="bold" fill="#111827">Average = sum of ratings ÷ number of ratings</text>
<text x="40" y="302" font-size="19" fill="#111827">= (5 + 4 + 4 + 5 + 3 + 4 + 3 + 0 + 0 + 0) ÷ 10</text>
<text x="40" y="338" font-size="19" fill="#111827">= 28 ÷ 10 = 2.8</text>
<text x="40" y="388" font-size="19" font-weight="bold" fill="#B91C1C">No customer gave a 0.</text>
<text x="775" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Blanks skipped</text>
<rect x="551" y="62" width="80" height="64" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="591" y="104" text-anchor="middle" font-size="28" fill="#111827">5</text>
<rect x="643" y="62" width="80" height="64" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="683" y="104" text-anchor="middle" font-size="28" fill="#111827">4</text>
<rect x="735" y="62" width="80" height="64" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="775" y="104" text-anchor="middle" font-size="28" fill="#111827">4</text>
<rect x="827" y="62" width="80" height="64" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="867" y="104" text-anchor="middle" font-size="28" fill="#111827">5</text>
<rect x="919" y="62" width="80" height="64" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="959" y="104" text-anchor="middle" font-size="28" fill="#111827">3</text>
<rect x="551" y="142" width="80" height="64" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="591" y="184" text-anchor="middle" font-size="28" fill="#111827">4</text>
<rect x="643" y="142" width="80" height="64" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="683" y="184" text-anchor="middle" font-size="28" fill="#111827">3</text>
<rect x="735" y="142" width="80" height="64" rx="8" fill="#ffffff" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5"/>
<text x="775" y="180" text-anchor="middle" font-size="17" fill="#475569">skipped</text>
<rect x="827" y="142" width="80" height="64" rx="8" fill="#ffffff" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5"/>
<text x="867" y="180" text-anchor="middle" font-size="17" fill="#475569">skipped</text>
<rect x="919" y="142" width="80" height="64" rx="8" fill="#ffffff" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5"/>
<text x="959" y="180" text-anchor="middle" font-size="17" fill="#475569">skipped</text>
<rect x="530" y="230" width="490" height="185" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="550" y="266" font-size="19" font-weight="bold" fill="#111827">Average = sum of ratings ÷ number of ratings</text>
<text x="550" y="302" font-size="19" fill="#111827">= (5 + 4 + 4 + 5 + 3 + 4 + 3) ÷ 7</text>
<text x="550" y="338" font-size="19" fill="#111827">= 28 ÷ 7 = 4.0</text>
<text x="550" y="388" font-size="19" font-weight="bold" fill="#1D4ED8">Matches what customers said.</text>
</svg>
