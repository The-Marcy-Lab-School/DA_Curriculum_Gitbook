<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Three data shapes: left-skewed, symmetric, right-skewed</title>
  <desc id="d">Three histograms side by side. Each has an x-axis for the value, from small to big, and a y-axis for how many values. Left-skewed: most values are big, with a tail of small values on the left; the mean (solid line) sits left of, or below, the median (dashed line). Symmetric: one peak in the middle; the mean and median are about the same. Right-skewed: most values are small, with a tail of big values on the right; the mean sits right of, or above, the median.</desc>
  <rect width="1040" height="470" fill="#ffffff"/>
  <text x="520" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">Which way does the data lean?</text>
  <line x1="270" y1="60" x2="310" y2="60" stroke="#1D4ED8" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="320" y="66" font-size="19" fill="#111827">Median (middle value)</text>
  <line x1="560" y1="60" x2="600" y2="60" stroke="#C2410C" stroke-width="4"/>
  <text x="610" y="66" font-size="19" fill="#111827">Mean (average)</text>
  <rect x="25" y="84" width="330" height="372" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="190" y="112" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Left-skewed</text>
  <g fill="#93C5FD" stroke="#1D4ED8" stroke-width="1.5">
    <rect x="81" y="324" width="28" height="6"/>
    <rect x="112" y="320" width="28" height="10"/>
    <rect x="143" y="312" width="28" height="18"/>
    <rect x="174" y="290" width="28" height="40"/>
    <rect x="205" y="255" width="28" height="75"/>
    <rect x="236" y="210" width="28" height="120"/>
    <rect x="267" y="165" width="28" height="165"/>
    <rect x="298" y="140" width="28" height="190"/>
  </g>
  <line x1="71" y1="330" x2="341" y2="330" stroke="#111827" stroke-width="2"/>
  <line x1="71" y1="128" x2="71" y2="330" stroke="#111827" stroke-width="2"/>
  <line x1="238" y1="124" x2="238" y2="330" stroke="#1D4ED8" stroke-width="4" stroke-dasharray="8 6"/>
  <line x1="188" y1="124" x2="188" y2="330" stroke="#C2410C" stroke-width="4"/>
  <text x="206" y="358" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Value →</text>
  <text x="47" y="229" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827" transform="rotate(-90 47 229)">How many →</text>
  <text x="190" y="398" text-anchor="middle" font-size="19" fill="#111827">Tail on the left</text>
  <text x="190" y="424" text-anchor="middle" font-size="19" fill="#475569">Mean is below the median</text>
  <rect x="370" y="84" width="330" height="372" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="535" y="112" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Symmetric</text>
  <g fill="#93C5FD" stroke="#1D4ED8" stroke-width="1.5">
    <rect x="426" y="300" width="28" height="30"/>
    <rect x="457" y="250" width="28" height="80"/>
    <rect x="488" y="190" width="28" height="140"/>
    <rect x="519" y="140" width="28" height="190"/>
    <rect x="550" y="140" width="28" height="190"/>
    <rect x="581" y="190" width="28" height="140"/>
    <rect x="612" y="250" width="28" height="80"/>
    <rect x="643" y="300" width="28" height="30"/>
  </g>
  <line x1="416" y1="330" x2="686" y2="330" stroke="#111827" stroke-width="2"/>
  <line x1="416" y1="128" x2="416" y2="330" stroke="#111827" stroke-width="2"/>
  <line x1="564" y1="124" x2="564" y2="330" stroke="#1D4ED8" stroke-width="4" stroke-dasharray="8 6"/>
  <line x1="570" y1="124" x2="570" y2="330" stroke="#C2410C" stroke-width="4"/>
  <text x="551" y="358" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Value →</text>
  <text x="392" y="229" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827" transform="rotate(-90 392 229)">How many →</text>
  <text x="535" y="398" text-anchor="middle" font-size="19" fill="#111827">No long tail</text>
  <text x="535" y="424" text-anchor="middle" font-size="19" fill="#475569">Mean and median about the same</text>
  <rect x="715" y="84" width="330" height="372" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="880" y="112" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Right-skewed</text>
  <g fill="#93C5FD" stroke="#1D4ED8" stroke-width="1.5">
    <rect x="771" y="140" width="28" height="190"/>
    <rect x="802" y="165" width="28" height="165"/>
    <rect x="833" y="210" width="28" height="120"/>
    <rect x="864" y="255" width="28" height="75"/>
    <rect x="895" y="290" width="28" height="40"/>
    <rect x="926" y="312" width="28" height="18"/>
    <rect x="957" y="320" width="28" height="10"/>
    <rect x="988" y="324" width="28" height="6"/>
  </g>
  <line x1="761" y1="330" x2="1031" y2="330" stroke="#111827" stroke-width="2"/>
  <line x1="761" y1="128" x2="761" y2="330" stroke="#111827" stroke-width="2"/>
  <line x1="890" y1="124" x2="890" y2="330" stroke="#1D4ED8" stroke-width="4" stroke-dasharray="8 6"/>
  <line x1="940" y1="124" x2="940" y2="330" stroke="#C2410C" stroke-width="4"/>
  <text x="896" y="358" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Value →</text>
  <text x="737" y="229" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827" transform="rotate(-90 737 229)">How many →</text>
  <text x="880" y="398" text-anchor="middle" font-size="19" fill="#111827">Tail on the right</text>
  <text x="880" y="424" text-anchor="middle" font-size="19" fill="#475569">Mean is above the median</text>
</svg>
