<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The gap that disappeared</title>
  <desc id="d">Two bar charts of FixIt's repair times. Left, all repairs: Downtown averages 45.7 minutes and Eastside 30.5, a gap of about 15 minutes. Right, screen repairs only: Downtown 50.0 minutes and Eastside 51.0, about the same. The gap came from the mix: Downtown did 5 screen repairs and 1 battery repair; Eastside did 2 screen and 4 battery. Screen repairs take longer.</desc>
