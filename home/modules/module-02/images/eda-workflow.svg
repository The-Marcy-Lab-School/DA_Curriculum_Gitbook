<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 300" width="1060" height="300" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The EDA workflow in Module 2</title>
  <desc id="d">Five steps from left to right: Inspect in Quest 2.2; Clean in Quests 2.6 and 2.7; Explore in Quests 2.1, 2.3 to 2.5 and 2.8; Check in Quests 2.9 and 2.10; Explain in Quest 2.11. The Boss Battle (Module Project) runs all five steps on one real dataset.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker>
  </defs>
  <rect width="1060" height="300" fill="#ffffff"/>
  <text x="530" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">The EDA workflow you'll practice in Module 2</text>
  <g font-size="18" fill="#111827" text-anchor="middle">
    <rect x="20" y="66" width="184" height="170" rx="12" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="112" y="100" font-size="21" font-weight="bold">1. Inspect</text>
    <text x="112" y="130">Is every row here?</text>
    <text x="112" y="152">Right types?</text>
    <text x="112" y="174">Any blanks?</text>
    <text x="112" y="204" fill="#475569">Quest 2.2</text>
    <rect x="234" y="66" width="184" height="170" rx="12" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="326" y="100" font-size="21" font-weight="bold">2. Clean</text>
    <text x="326" y="130">Fix problems</text>
    <text x="326" y="152">on purpose</text>
    <text x="326" y="204" fill="#475569">Quests 2.6–2.7</text>
    <rect x="448" y="66" width="184" height="170" rx="12" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="540" y="100" font-size="21" font-weight="bold">3. Explore</text>
    <text x="540" y="130">Stats, groups</text>
    <text x="540" y="152">and charts</text>
    <text x="540" y="193" fill="#475569">Quests 2.1,</text>
    <text x="540" y="215" fill="#475569">2.3–2.5, 2.8</text>
    <rect x="662" y="66" width="184" height="170" rx="12" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="754" y="100" font-size="21" font-weight="bold">4. Check</text>
    <text x="754" y="130">Question the</text>
    <text x="754" y="152">data and the AI</text>
    <text x="754" y="204" fill="#475569">Quests 2.9–2.10</text>
    <rect x="876" y="66" width="184" height="170" rx="12" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="968" y="100" font-size="21" font-weight="bold">5. Explain</text>
    <text x="968" y="130">Write a README</text>
    <text x="968" y="152">and a memo</text>
    <text x="968" y="204" fill="#475569">Quest 2.11</text>
  </g>
  <g stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)">
    <line x1="206" y1="150" x2="231" y2="150"/>
    <line x1="420" y1="150" x2="445" y2="150"/>
    <line x1="634" y1="150" x2="659" y2="150"/>
    <line x1="848" y1="150" x2="873" y2="150"/>
  </g>
  <text x="530" y="278" text-anchor="middle" font-size="20" fill="#111827">The Boss Battle (Module Project) runs all five steps on one real dataset.</text>
</svg>
