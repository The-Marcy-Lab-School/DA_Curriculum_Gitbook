<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Checking an AI's answer, claim by claim</title>
  <desc id="d">Step 1: calculate your own numbers first. Step 2: ask the AI about your chart. Step 3: split its answer into separate claims. Each claim gets a verdict: right, wrong, or unverifiable, with the number that settles it. Step 4: you decide what to share, because you are responsible for it.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs>
  <rect width="1040" height="470" fill="#ffffff"/>
  <text x="520" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">Checking an AI's answer, claim by claim</text>
  <rect x="30" y="64" width="300" height="90" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="180" y="100" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D4ED8">1. Your numbers</text>
  <text x="180" y="130" text-anchor="middle" font-size="18" fill="#111827">Calculate them first</text>
  <line x1="332" y1="109" x2="368" y2="109" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="370" y="64" width="300" height="90" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="520" y="100" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D4ED8">2. Ask the AI</text>
  <text x="520" y="130" text-anchor="middle" font-size="18" fill="#111827">about your chart</text>
  <line x1="672" y1="109" x2="708" y2="109" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="710" y="64" width="300" height="90" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="860" y="100" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D4ED8">3. Split the answer</text>
  <text x="860" y="130" text-anchor="middle" font-size="18" fill="#111827">into separate claims</text>
  <line x1="860" y1="156" x2="180" y2="206" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="30" y="210" width="300" height="100" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="180" y="246" text-anchor="middle" font-size="22" font-weight="bold" fill="#1D4ED8">Right</text>
  <text x="180" y="278" text-anchor="middle" font-size="18" fill="#111827">Your numbers agree</text>
  <line x1="180" y1="312" x2="180" y2="364" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="860" y1="156" x2="520" y2="206" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="370" y="210" width="300" height="100" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
  <text x="520" y="246" text-anchor="middle" font-size="22" font-weight="bold" fill="#C2410C">Wrong</text>
  <text x="520" y="278" text-anchor="middle" font-size="18" fill="#111827">Your numbers disagree</text>
  <line x1="520" y1="312" x2="520" y2="364" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="860" y1="156" x2="860" y2="206" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="710" y="210" width="300" height="100" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="860" y="246" text-anchor="middle" font-size="22" font-weight="bold" fill="#475569">Unverifiable</text>
  <text x="860" y="278" text-anchor="middle" font-size="18" fill="#111827">Nothing you have settles it</text>
  <line x1="860" y1="312" x2="860" y2="364" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="30" y="368" width="980" height="84" rx="10" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="520" y="400" text-anchor="middle" font-size="21" font-weight="bold" fill="#111827">4. You decide what to share</text>
  <text x="520" y="430" text-anchor="middle" font-size="19" fill="#111827">Name the number that settles each claim. You are responsible for what you share, not the AI.</text>
</svg>
