<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Drop, fill, or flag decision</title>
  <desc id="d">Start with a missing value. If nothing useful is left in the row, drop the row. If something is left, ask whether there is a fair stand-in. If yes, fill it with the median, the mode or the value before, and flag that it was filled. If no, flag it: keep the blank and add a True or False column.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
  </defs>
  <rect width="960" height="460" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Drop, fill, or flag: two questions decide</text>

  <rect x="340" y="58" width="240" height="42" rx="21" fill="#E2E8F0" stroke="#111827" stroke-width="1.5"/>
  <text x="460" y="85" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">A value is missing</text>

  <rect x="280" y="130" width="360" height="56" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="460" y="164" text-anchor="middle" font-size="18" fill="#111827">Is anything useful left in the row?</text>

  <rect x="6" y="116" width="240" height="88" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="126" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Drop the row</text>
  <text x="126" y="172" text-anchor="middle" font-size="17" fill="#475569">Example: the app crashed</text>
  <text x="126" y="193" text-anchor="middle" font-size="17" fill="#475569">and every field is blank</text>

  <rect x="260" y="240" width="400" height="66" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="460" y="268" text-anchor="middle" font-size="18" fill="#111827">Is there a fair stand-in?</text>
  <text x="460" y="290" text-anchor="middle" font-size="17" fill="#475569">(the median, the mode, or the value before)</text>

  <rect x="712" y="222" width="240" height="112" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="832" y="250" text-anchor="middle" font-size="18" font-weight="bold" fill="#1D4ED8">Fill it</text>
  <text x="832" y="274" text-anchor="middle" font-size="17" fill="#111827">Say what you used,</text>
  <text x="832" y="296" text-anchor="middle" font-size="17" fill="#111827">and add a column that</text>
  <text x="832" y="318" text-anchor="middle" font-size="17" fill="#111827">marks the filled rows</text>

  <rect x="300" y="348" width="320" height="96" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
  <text x="460" y="376" text-anchor="middle" font-size="18" font-weight="bold" fill="#C2410C">Flag it</text>
  <text x="460" y="400" text-anchor="middle" font-size="17" fill="#111827">Keep the blank. Add a</text>
  <text x="460" y="424" text-anchor="middle" font-size="17" fill="#111827">True/False column that marks it</text>

  <g stroke="#111827" stroke-width="2" marker-end="url(#a)">
    <line x1="460" y1="100" x2="460" y2="126"/>
    <line x1="280" y1="158" x2="250" y2="158"/>
    <line x1="460" y1="186" x2="460" y2="236"/>
    <line x1="660" y1="273" x2="708" y2="273"/>
    <line x1="460" y1="306" x2="460" y2="344"/>
  </g>
  <g font-size="17" font-weight="bold" fill="#111827">
    <text x="252" y="150">No</text>
    <text x="470" y="218">Yes</text>
    <text x="668" y="264">Yes</text>
    <text x="470" y="332">No</text>
  </g>
</svg>
