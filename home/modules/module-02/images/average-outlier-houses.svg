<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" width="1040" height="480" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">One outlier pulls the average</title>
<desc id="d">Left: ten houses on one street. Nine grey houses sold for $300K each, and one red house sold for $3M. Average = (9 × $300K + $3M) ÷ 10 = $5.7M ÷ 10 = $570K, and no house sold near $570K. Right: ten grey houses that each sold for $300K. Average = (10 × $300K) ÷ 10 = $300K, which matches every house.</desc>
