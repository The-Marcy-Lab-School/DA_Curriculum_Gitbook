<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How groupby works</title>
  <desc id="d">Step 1 splits six blood-drive rows into one pile per site. Step 2 takes the mean of units in each pile: Library 28.5, Community Center 38.0, Fire Station 22.0. Step 3 combines the answers into a table with one row per site.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker>
  </defs>
  <rect width="900" height="350" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">groupby: split the rows, summarize each pile, combine the answers</text>
  <g font-size="16" font-weight="bold" fill="#1D4ED8" text-anchor="middle">
    <text x="150" y="72">1. Split</text>
    <text x="455" y="72">2. Apply (mean)</text>
    <text x="755" y="72">3. Combine</text>
  </g>
  <g font-size="14" fill="#111827">
    <rect x="40" y="86" width="220" height="196" fill="#ffffff" stroke="#94A3B8"/>
    <rect x="40" y="86" width="220" height="28" fill="#E2E8F0"/>
    <text x="52" y="105" font-weight="bold">site</text><text x="200" y="105" font-weight="bold">units</text>
    <text x="52" y="133">Library</text><text x="200" y="133">26</text>
    <text x="52" y="161">Fire Station</text><text x="200" y="161">20</text>
    <text x="52" y="189">Library</text><text x="200" y="189">31</text>
    <text x="52" y="217">Community Center</text><text x="200" y="217">40</text>
    <text x="52" y="245">Fire Station</text><text x="200" y="245">24</text>
    <text x="52" y="273">Community Center</text><text x="200" y="273">36</text>
  </g>
  <g font-size="14" fill="#111827">
    <rect x="340" y="88" width="230" height="56" rx="8" fill="#EFF6FF" stroke="#1D4ED8"/>
    <text x="352" y="110" font-weight="bold">Community Center</text>
    <text x="352" y="132">40, 36  →  mean 38.0</text>
    <rect x="340" y="156" width="230" height="56" rx="8" fill="#EFF6FF" stroke="#1D4ED8"/>
    <text x="352" y="178" font-weight="bold">Fire Station</text>
    <text x="352" y="200">20, 24  →  mean 22.0</text>
    <rect x="340" y="224" width="230" height="56" rx="8" fill="#EFF6FF" stroke="#1D4ED8"/>
    <text x="352" y="246" font-weight="bold">Library</text>
    <text x="352" y="268">26, 31  →  mean 28.5</text>
  </g>
  <g font-size="14" fill="#111827">
    <rect x="650" y="128" width="210" height="112" fill="#ffffff" stroke="#94A3B8"/>
    <rect x="650" y="128" width="210" height="28" fill="#E2E8F0"/>
    <text x="662" y="147" font-weight="bold">site</text><text x="800" y="147" font-weight="bold">units</text>
    <text x="662" y="175">Community Center</text><text x="808" y="175">38.0</text>
    <text x="662" y="203">Fire Station</text><text x="808" y="203">22.0</text>
    <text x="662" y="231">Library</text><text x="808" y="231">28.5</text>
  </g>
  <g stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)">
    <line x1="266" y1="184" x2="334" y2="184"/>
    <line x1="576" y1="184" x2="644" y2="184"/>
  </g>
  <text x="450" y="326" text-anchor="middle" font-size="16" font-family="Menlo, Consolas, monospace" fill="#111827">drives.groupby("site")["units"].mean()</text>
</svg>
