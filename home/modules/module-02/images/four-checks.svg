<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="1040" height="420" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Four checks before you filter</title>
  <desc id="d">Load a new file with pd.read_csv. Then run four checks in order. Shape: did every row arrive? df.shape. Data types: is each column the right type? df.dtypes. Missing values: where are the blanks? df.isna().sum(). Duplicates: do any rows repeat? df.duplicated().sum(). Only then filter to keep the rows you need.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs>
  <rect width="1040" height="420" fill="#ffffff"/>
  <text x="520" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">Four checks before you filter</text>
  <rect x="345" y="58" width="350" height="50" rx="25" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="520" y="90" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">Load a new file:  pd.read_csv(...)</text>
  <line x1="520" y1="110" x2="520" y2="146" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="15" y="150" width="236" height="160" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="133" y="184" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D4ED8">1. Shape</text>
  <text x="133" y="216" text-anchor="middle" font-size="18" fill="#111827">Did every row</text>
  <text x="133" y="240" text-anchor="middle" font-size="18" fill="#111827">arrive?</text>
  <text x="133" y="284" text-anchor="middle" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111827">df.shape</text>
  <line x1="253" y1="230" x2="271" y2="230" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="273" y="150" width="236" height="160" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="391" y="184" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D4ED8">2. Data types</text>
  <text x="391" y="216" text-anchor="middle" font-size="18" fill="#111827">Is each column</text>
  <text x="391" y="240" text-anchor="middle" font-size="18" fill="#111827">the right type?</text>
  <text x="391" y="284" text-anchor="middle" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111827">df.dtypes</text>
  <line x1="511" y1="230" x2="529" y2="230" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="531" y="150" width="236" height="160" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="649" y="184" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D4ED8">3. Missing values</text>
  <text x="649" y="216" text-anchor="middle" font-size="18" fill="#111827">Where are</text>
  <text x="649" y="240" text-anchor="middle" font-size="18" fill="#111827">the blanks?</text>
  <text x="649" y="284" text-anchor="middle" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111827">df.isna().sum()</text>
  <line x1="769" y1="230" x2="787" y2="230" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="789" y="150" width="236" height="160" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="907" y="184" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D4ED8">4. Duplicates</text>
  <text x="907" y="216" text-anchor="middle" font-size="18" fill="#111827">Do any rows</text>
  <text x="907" y="240" text-anchor="middle" font-size="18" fill="#111827">repeat?</text>
  <text x="907" y="284" text-anchor="middle" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111827">df.duplicated().sum()</text>
  <line x1="520" y1="312" x2="520" y2="348" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="320" y="352" width="400" height="50" rx="25" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
  <text x="520" y="384" text-anchor="middle" font-size="19" font-weight="bold" fill="#C2410C">Then filter: keep the rows you need</text>
</svg>
