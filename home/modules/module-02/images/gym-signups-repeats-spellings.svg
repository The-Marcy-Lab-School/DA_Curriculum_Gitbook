<text x="590" y="127" text-anchor="start" font-size="19" font-weight="normal" fill="#111827">Ana</text>
<text x="790" y="127" text-anchor="start" font-size="19" font-weight="normal" fill="#111827">yoga</text>
<rect x="570" y="140" width="200" height="40" rx="0" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<rect x="770" y="140" width="250" height="40" rx="0" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="590" y="167" text-anchor="start" font-size="19" font-weight="normal" fill="#111827">Ben</text>
<text x="790" y="167" text-anchor="start" font-size="19" font-weight="normal" fill="#111827">spin</text>
<rect x="570" y="180" width="200" height="40" rx="0" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<rect x="770" y="180" width="250" height="40" rx="0" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="590" y="207" text-anchor="start" font-size="19" font-weight="normal" fill="#111827">Cara</text>
<text x="790" y="207" text-anchor="start" font-size="19" font-weight="normal" fill="#111827">yoga</text>
<rect x="570" y="220" width="200" height="40" rx="0" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<rect x="770" y="220" width="250" height="40" rx="0" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="590" y="247" text-anchor="start" font-size="19" font-weight="normal" fill="#111827">Dev</text>
<text x="790" y="247" text-anchor="start" font-size="19" font-weight="normal" fill="#111827">yoga</text>
<rect x="570" y="260" width="200" height="40" rx="0" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<rect x="770" y="260" width="250" height="40" rx="0" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="590" y="287" text-anchor="start" font-size="19" font-weight="normal" fill="#111827">Eli</text>
<text x="790" y="287" text-anchor="start" font-size="19" font-weight="normal" fill="#111827">spin</text>
<rect x="20" y="365" width="450" height="140" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="40" y="398" text-anchor="start" font-size="19" font-weight="bold" fill="#111827">Count of each class:</text>
<text x="40" y="432" text-anchor="start" font-size="19" font-weight="normal" fill="#111827">Yoga 2, yoga 1, YOGA 1, Spin 2</text>
<text x="40" y="470" text-anchor="start" font-size="19" font-weight="bold" fill="#B91C1C">Yoga looks like 3 classes,</text>
<text x="40" y="496" text-anchor="start" font-size="19" font-weight="bold" fill="#B91C1C">with 4 sign-ups for 3 people.</text>
<rect x="570" y="365" width="450" height="140" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="590" y="398" text-anchor="start" font-size="19" font-weight="bold" fill="#111827">Count of each class:</text>
<text x="590" y="432" text-anchor="start" font-size="19" font-weight="normal" fill="#111827">yoga 3, spin 2</text>
<text x="590" y="470" text-anchor="start" font-size="19" font-weight="bold" fill="#1D4ED8">One yoga class, 3 people.</text>
