<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Repeats and spellings split one class into three</title>
<desc id="d">Left, a messy sign-up sheet with 6 rows. Ana signs up for Yoga twice, and that repeated row is red. Yoga is spelled three ways: Yoga, yoga, and YOGA, and the two odd spellings are red. Counting each class gives Yoga 2, yoga 1, YOGA 1, and Spin 2, so Yoga looks like 3 different classes. Right, the clean sheet has 5 rows, one per person, with every label in lowercase. Counting gives yoga 3 and spin 2: one yoga class with 3 people.</desc>
<rect width="1040" height="520" fill="#ffffff"/>
<text x="245" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Messy sheet: 6 rows</text>
<rect x="20" y="60" width="450" height="40" rx="0" fill="#E2E8F0" stroke="#475569" stroke-width="2.5"/>
<text x="40" y="87" text-anchor="start" font-size="19" font-weight="bold" fill="#111827">Name</text>
<text x="240" y="87" text-anchor="start" font-size="19" font-weight="bold" fill="#111827">Class</text>
<rect x="20" y="100" width="200" height="40" rx="0" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<rect x="220" y="100" width="250" height="40" rx="0" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="40" y="127" text-anchor="start" font-size="19" font-weight="normal" fill="#111827">Ana</text>
<text x="240" y="127" text-anchor="start" font-size="19" font-weight="normal" fill="#111827">Yoga</text>
<rect x="20" y="140" width="200" height="40" rx="0" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<rect x="220" y="140" width="250" height="40" rx="0" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="40" y="167" text-anchor="start" font-size="19" font-weight="normal" fill="#111827">Ben</text>
<text x="240" y="167" text-anchor="start" font-size="19" font-weight="normal" fill="#111827">Spin</text>
<rect x="20" y="180" width="200" height="40" rx="0" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<rect x="220" y="180" width="250" height="40" rx="0" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2.5"/>
<text x="40" y="207" text-anchor="start" font-size="19" font-weight="normal" fill="#111827">Cara</text>
<text x="240" y="207" text-anchor="start" font-size="19" font-weight="bold" fill="#B91C1C">yoga</text>
<text x="455" y="207" text-anchor="end" font-size="17" font-weight="bold" fill="#B91C1C" font-style="italic">spelling</text>
<rect x="20" y="220" width="200" height="40" rx="0" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2.5"/>
<rect x="220" y="220" width="250" height="40" rx="0" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2.5"/>
<text x="40" y="247" text-anchor="start" font-size="19" font-weight="bold" fill="#B91C1C">Ana</text>
<text x="240" y="247" text-anchor="start" font-size="19" font-weight="bold" fill="#B91C1C">Yoga</text>
<text x="455" y="247" text-anchor="end" font-size="17" font-weight="bold" fill="#B91C1C" font-style="italic">repeat</text>
<rect x="20" y="260" width="200" height="40" rx="0" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<rect x="220" y="260" width="250" height="40" rx="0" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2.5"/>
<text x="40" y="287" text-anchor="start" font-size="19" font-weight="normal" fill="#111827">Dev</text>
<text x="240" y="287" text-anchor="start" font-size="19" font-weight="bold" fill="#B91C1C">YOGA</text>
<text x="455" y="287" text-anchor="end" font-size="17" font-weight="bold" fill="#B91C1C" font-style="italic">spelling</text>
<rect x="20" y="300" width="200" height="40" rx="0" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<rect x="220" y="300" width="250" height="40" rx="0" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
<text x="40" y="327" text-anchor="start" font-size="19" font-weight="normal" fill="#111827">Eli</text>
<text x="240" y="327" text-anchor="start" font-size="19" font-weight="normal" fill="#111827">Spin</text>
<text x="795" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Clean sheet: 5 rows</text>
