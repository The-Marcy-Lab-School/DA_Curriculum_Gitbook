<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Same numbers, two y-axes</title>
  <desc id="d">Two bar charts of the same data: phone A lasts 20 hours and phone B lasts 19 hours. Left chart: the y-axis starts at 18, so phone A's bar looks twice as tall as phone B's. Right chart: the y-axis starts at 0, so the bars look almost the same height, which matches the real difference of about 5%.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker></defs>
  <rect width="1040" height="470" fill="#ffffff"/>
  <text x="520" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">Same numbers, two y-axes</text>
  <line x1="120" y1="125" x2="120" y2="370" stroke="#111827" stroke-width="2"/>
  <line x1="120" y1="370" x2="460" y2="370" stroke="#111827" stroke-width="2"/>
  <line x1="112" y1="370.0" x2="120" y2="370.0" stroke="#111827" stroke-width="2"/>
  <text x="106" y="376.0" text-anchor="end" font-size="18" fill="#111827">18</text>
  <line x1="112" y1="252.5" x2="120" y2="252.5" stroke="#111827" stroke-width="2"/>
  <text x="106" y="258.5" text-anchor="end" font-size="18" fill="#111827">19</text>
  <line x1="112" y1="135.0" x2="120" y2="135.0" stroke="#111827" stroke-width="2"/>
  <text x="106" y="141.0" text-anchor="end" font-size="18" fill="#111827">20</text>
  <rect x="170" y="135.0" width="100" height="235.0" rx="0" fill="#93C5FD" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="220" y="125.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">20 hours</text>
  <text x="220" y="398" text-anchor="middle" font-size="18" fill="#111827">Phone A</text>
  <rect x="320" y="252.5" width="100" height="117.5" rx="0" fill="#93C5FD" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="370" y="242.5" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">19 hours</text>
  <text x="370" y="398" text-anchor="middle" font-size="18" fill="#111827">Phone B</text>
  <text x="38" y="252" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827" transform="rotate(-90 38 252)">Battery life (hours)</text>
  <text x="290" y="82" text-anchor="middle" font-size="21" font-weight="bold" fill="#C2410C">Y-axis starts at 18</text>
  <text x="290" y="436" text-anchor="middle" font-size="19" font-weight="bold" fill="#C2410C">Looks twice as long</text>
  <line x1="640" y1="125" x2="640" y2="370" stroke="#111827" stroke-width="2"/>
  <line x1="640" y1="370" x2="980" y2="370" stroke="#111827" stroke-width="2"/>
  <line x1="632" y1="370.0" x2="640" y2="370.0" stroke="#111827" stroke-width="2"/>
  <text x="626" y="376.0" text-anchor="end" font-size="18" fill="#111827">0</text>
  <line x1="632" y1="252.5" x2="640" y2="252.5" stroke="#111827" stroke-width="2"/>
  <text x="626" y="258.5" text-anchor="end" font-size="18" fill="#111827">10</text>
  <line x1="632" y1="135.0" x2="640" y2="135.0" stroke="#111827" stroke-width="2"/>
  <text x="626" y="141.0" text-anchor="end" font-size="18" fill="#111827">20</text>
  <rect x="690" y="135.0" width="100" height="235.0" rx="0" fill="#93C5FD" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="740" y="125.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">20 hours</text>
  <text x="740" y="398" text-anchor="middle" font-size="18" fill="#111827">Phone A</text>
  <rect x="840" y="146.75" width="100" height="223.25" rx="0" fill="#93C5FD" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="890" y="136.75" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">19 hours</text>
  <text x="890" y="398" text-anchor="middle" font-size="18" fill="#111827">Phone B</text>
  <text x="558" y="252" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827" transform="rotate(-90 558 252)">Battery life (hours)</text>
  <text x="810" y="82" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D4ED8">Y-axis starts at 0</text>
  <text x="810" y="436" text-anchor="middle" font-size="19" font-weight="bold" fill="#1D4ED8">Honest: about 5% longer</text>
  <line x1="520" y1="70" x2="520" y2="450" stroke="#94A3B8" stroke-width="1.5"/>
</svg>
