<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Mean and median in right-skewed data</title>
  <desc id="d">A histogram. The x-axis is the value, from small to big. The y-axis is how many values fall in each range. Most values are small, and a few big values form a long tail to the right. The median line sits among the tall bars. The mean line sits further right, pulled toward the tail.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="840" height="400" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Right-skewed data: the tail pulls the mean away from the median</text>
  <g fill="#93C5FD" stroke="#1D4ED8" stroke-width="1.5">
    <rect x="104" y="150" width="50" height="140"/>
    <rect x="158" y="100" width="50" height="190"/>
    <rect x="212" y="140" width="50" height="150"/>
    <rect x="266" y="200" width="50" height="90"/>
    <rect x="320" y="240" width="50" height="50"/>
    <rect x="374" y="262" width="50" height="28"/>
    <rect x="428" y="276" width="50" height="14"/>
    <rect x="482" y="282" width="50" height="8"/>
    <rect x="590" y="284" width="50" height="6"/>
    <rect x="752" y="286" width="50" height="4"/>
  </g>
  <line x1="96" y1="290" x2="815" y2="290" stroke="#111827" stroke-width="2"/>
  <line x1="96" y1="70" x2="96" y2="290" stroke="#111827" stroke-width="2"/>
  <line x1="220" y1="82" x2="220" y2="290" stroke="#1D4ED8" stroke-width="3.5" stroke-dasharray="8 6"/>
  <text x="220" y="72" text-anchor="middle" font-size="20" font-weight="bold" fill="#1D4ED8">Median</text>
  <line x1="354" y1="82" x2="354" y2="290" stroke="#C2410C" stroke-width="3.5"/>
  <text x="354" y="72" text-anchor="middle" font-size="20" font-weight="bold" fill="#C2410C">Mean</text>
  <text x="560" y="196" font-size="19" fill="#475569">A few very big values</text>
  <text x="560" y="220" font-size="19" fill="#475569">make a long tail</text>
  <line x1="700" y1="232" x2="770" y2="278" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="455" y="326" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Value, from small to big (for example, dollars per gift) →</text>
  <text x="40" y="180" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827" transform="rotate(-90 40 180)">How many values →</text>
  <text x="440" y="376" text-anchor="middle" font-size="19" fill="#111827">Report the median as the typical value. Mention the big values on their own.</text>
</svg>
